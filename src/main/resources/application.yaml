spring:
  application:
    name: lms-platform
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jooq:
    sql-dialect: postgres

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

app:
  cors:
    allowed-origins: ${LMS_ALLOWED_ORIGINS:http://localhost:5173}
